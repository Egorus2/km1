version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kmstand
      POSTGRES_USER: kmstand
      POSTGRES_PASSWORD: kmstand
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kmstand -d kmstand" ]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: kmstand.settings
      DATABASE_URL: postgres://kmstand:kmstand@db:5432/kmstand
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      daphne -b 0.0.0.0 -p 8000 kmstand.asgi:application
      "
    volumes:
      - .:/app
      - ./frontend:/frontend:ro
      - /dev:/dev
    privileged: true

  worker:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: kmstand.settings
      DATABASE_URL: postgres://kmstand:kmstand@db:5432/kmstand
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A kmstand worker -l info

volumes:
  pgdata: